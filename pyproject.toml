[project]
name = "epigrass-qgis"
version = "0.1.0"
description = "Development tooling for the Epigrass QGIS plugin (the plugin itself runs inside QGIS)"
readme = "README.md"
license = { text = "GPLv3" }
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "bandit>=1.8",
]

[tool.bandit]
exclude_dirs = ["dist", "tests"]
# B404 flags the mere `import subprocess`; the plugin's core job is driving
# external processes (venv, pip, epirunner, redis). Every call site uses an
# argv list (no shell) and is audited: see nosec comments in env/ and runner/.
skips = ["B404"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
    "integration: tests that require Epigrass installed",
]

[tool.qgis-plugin-ci]
plugin_path = "epigrass_qgis"
github_org_repo = "fccoelho/epigrass-qgis"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["epigrass_qgis/icons"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP", "RUF"]
ignore = [
    "N802",  # Qt method names (canvasReleaseEvent...) follow the Qt API
    "N999",  # plugin module names follow QGIS conventions
    "UP007", # keep Optional-style unions for QGIS (3.x) compatibility
    "UP045", # same
    "RUF012",# mutable class attributes are fine for Qt widgets
    "E501",  # long lines allowed in generated templates
]

[tool.ruff.lint.per-file-ignores]
# QGIS-dependent modules cannot be imported during lint-time test collection
"tests/test_integration_epigrass.py" = ["E402"]
