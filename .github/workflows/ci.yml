name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: Unit tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dev tooling
        run: uv sync --group dev
      - name: Lint
        run: uv run ruff check .
      - name: Unit tests
        run: uv run pytest -m "not integration"

  package:
    name: Build plugin zip
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build plugin zip
        run: python scripts/build_zip.py --out dist
      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: epigrass-plugin-zip
          path: dist/*.zip
          retention-days: 30

  qgis:
    name: QGIS ${{ matrix.qgis }} import smoke test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        qgis: ["3.34", "3.40"]
    container:
      image: qgis/qgis:${{ matrix.qgis }}
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Import plugin with QGIS python
        run: |
          python3 - <<'EOF'
          import importlib
          import sys
          import traceback

          sys.path.insert(0, ".")

          # 1. Syntax check under the image's Python (3.34 ships py3.9:
          #    guards against accidentally using newer syntax).
          import compileall
          assert compileall.compile_dir("epigrass_qgis", quiet=1), "Compilation failed"

          # 2. Full import of every module when the QGIS bindings are
          #    importable without a running app (entrypoint-dependent).
          try:
              import qgis.core  # noqa: F401
          except ImportError:
              print("qgis bindings not on default path; syntax-only check")
              sys.exit(0)

          modules = [
              "epigrass_qgis.defs",
              "epigrass_qgis.env.doctor",
              "epigrass_qgis.env.python_env",
              "epigrass_qgis.env.redis_service",
              "epigrass_qgis.writer.epg_writer",
              "epigrass_qgis.builder.presets",
              "epigrass_qgis.builder.network_builder",
              "epigrass_qgis.builder.layer_export",
              "epigrass_qgis.builder.seed_picker",
              "epigrass_qgis.builder.wizard",
              "epigrass_qgis.runner.task",
              "epigrass_qgis.results.loader",
              "epigrass_qgis.results.temporal",
              "epigrass_qgis.settings",
              "epigrass_qgis.plugin",
          ]
          failed = []
          for name in modules:
              try:
                  importlib.import_module(name)
              except Exception:
                  traceback.print_exc()
                  failed.append(name)
          assert not failed, f"Import failed: {failed}"
          print("All plugin modules import under QGIS Python", sys.version.split()[0])
          EOF
